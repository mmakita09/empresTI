services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: empresti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d empresti"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/empresti
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@db:5432/empresti
      NODE_ENV: production
    command: >-
      sh -c "npm run db:deploy && npm run db:seed && npm start"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
