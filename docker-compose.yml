services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: empresti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d empresti"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/empresti
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/empresti
      APP_ENV: development
      SESSION_COOKIE_NAME: empresti_session
      SESSION_TTL_SECONDS: 86400
      SESSION_COOKIE_SECURE: "false"
      SESSION_SECRET: local-development-only
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:

